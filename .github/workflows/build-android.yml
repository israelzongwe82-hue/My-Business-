name: Construire My Business pour Android

on:
workflow_dispatch:
push:
branches:
- main
paths:
- "index.html"
- "style.css"
- "app.js"
- "manifest.json"
- "package.json"
- "capacitor.config.json"
- "main.js"
- "images/**"
- ".github/workflows/build-android.yml"

permissions:
contents: read

jobs:
build-android:
name: Construire l'APK Android
runs-on: ubuntu-latest

steps:
  - name: Télécharger le dépôt
    uses: actions/checkout@v4

  - name: Installer Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "21"

  - name: Installer les dépendances
    run: npm install

  - name: Vérifier les images originales
    run: |
      test -f images/icon.png
      test -f images/splash.png

  - name: Installer ImageMagick
    run: |
      sudo apt-get update
      sudo apt-get install -y imagemagick

  - name: Préparer les images Android
    run: |
      mkdir -p assets

      cp images/icon.png assets/icon-only.png
      cp images/icon.png assets/icon-foreground.png

      convert -size 1024x1024 xc:'#1565c0' \
        assets/icon-background.png

      convert images/splash.png \
        -resize 2732x2732 \
        -background '#1565c0' \
        -gravity center \
        -extent 2732x2732 \
        assets/splash.png

  - name: Installer le générateur de ressources
    run: npm install --save-dev @capacitor/assets

  - name: Ajouter la plateforme Android
    run: npx cap add android

  - name: Générer les icônes et le splash natifs
    run: npx capacitor-assets generate --android

  - name: Synchroniser Capacitor
    run: npx cap sync android

  - name: Construire l'APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Publier l'APK
    uses: actions/upload-artifact@v4
    with:
      name: My-Business-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
