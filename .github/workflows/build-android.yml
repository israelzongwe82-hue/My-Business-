name: Construire My Business pour Android

on:
workflow_dispatch:
push:
branches:
- main
paths:
- "index.html"
- "style.css"
- "app.js"
- "manifest.json"
- "package.json"
- "capacitor.config.json"
- "main.js"
- "images/**"
- ".github/workflows/build-android.yml"

permissions:
contents: read

jobs:
build-android:
name: Construire l'APK Android
runs-on: ubuntu-latest

steps:
  - name: Télécharger le dépôt
    uses: actions/checkout@v4

  - name: Installer Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "21"

  - name: Installer les dépendances
    run: npm install

  - name: Vérifier la configuration Capacitor
    run: npx cap --version

  - name: Préparer Android
    run: |
      npx cap add android
      npx cap sync android

  - name: Configurer Android SDK
    uses: android-actions/setup-android@v3

  - name: Construire l'APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Publier l'APK
    uses: actions/upload-artifact@v4
    with:
      name: My-Business-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
